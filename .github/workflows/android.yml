name: 打包安卓安装包

# 在 GitHub 自己的构建机上把站点打包成 APK。
#
# 为什么不在本机打：本机没有 JDK / Android SDK，而安卓 SDK 的下载源
# （dl.google.com）在国内基本拉不动 —— 装一次要跟网络搏斗半天。
# GitHub 的构建机自带 JDK + 整个 Android SDK，只要推一次代码就出包。
#
# 触发：改到站点文件或安卓工程时自动跑；也可以在 Actions 页手动点。
#
# 排查约定：这个工作流**不指望你打开浏览器翻日志**。
# 失败时会把关键几行摊成 GitHub 的「检查注解」（::error::），
# 那个接口不用登录就能读 —— 用 API 或者命令行都能直接看到是哪一行炸的。

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'app.js'
      - 'style.css'
      - 'data/**'
      - 'ocr/**'
      - 'android-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

# 挂 Release 需要写权限。
# ⚠️ 如果仓库在 Settings → Actions → General → Workflow permissions 里被设成
#    「只读」，这里会被降级，挂 Release 就会 403 —— 那个失败会摊成注解告诉你。
permissions:
  contents: write

# 两次构建同时改同一个 Release 会打架，排队来
concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 ./gradlew：仓库里没有 gradle-wrapper.jar（本机没 JDK 生不出来）。
      # 直接把固定版本的 Gradle 拽下来，省得依赖构建机上预装的是哪个版本。
      - name: 装 Gradle 8.7
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      # 构建机上的 SDK 路径偶尔和印象里的不一样（镜像换版、变量没设都会踩）。
      # 这里自己找一遍并写进 local.properties ——
      # 「SDK location not found」是 AGP 在 CI 上最常见的一类失败，
      # 与其猜 ANDROID_HOME 有没有值，不如落成文件。
      - name: 认出安卓 SDK 并写进 local.properties
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            for c in /usr/local/lib/android/sdk "$HOME/Android/Sdk" /opt/android-sdk; do
              if [ -d "$c" ]; then SDK="$c"; break; fi
            done
          fi
          echo "ANDROID_HOME=${ANDROID_HOME:-（空）}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-（空）}"
          echo "挑中的 SDK = $SDK"
          if [ ! -d "$SDK" ]; then echo "找不到安卓 SDK"; exit 1; fi
          echo "── platforms ──";   ls "$SDK/platforms"   || true
          echo "── build-tools ──"; ls "$SDK/build-tools" || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "sdk.dir=$SDK" > android-app/local.properties
          echo "── java ──";   java -version 2>&1 | head -2
          echo "── gradle ──"; gradle --version 2>&1 | head -6

      # 签名钥匙是 Python 的 cryptography 生成的（本机没有 JDK/keytool）。
      # 先让 Java 自己读一遍 —— 万一它认不了这份 PKCS12，
      # 会在这里就报清楚，而不是等到打包最后一步签不上名。
      - name: 预检签名钥匙
        run: |
          keytool -list -keystore android-app/keystore.p12 \
            -storetype PKCS12 -storepass english-exam-trainer
          # 别名对不对也要查 —— keytool -list 只要文件能读就返回 0，
          # 别名写错它照样"成功"，然后打包时才报 No key with alias。
          keytool -list -keystore android-app/keystore.p12 \
            -storetype PKCS12 -storepass english-exam-trainer \
            | grep -q "key0" || { echo "钥匙里没有别名 key0"; exit 1; }

      - name: 把站里的文件搬进 App
        run: |
          rm -rf android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/assets
          cp -r index.html app.js style.css data ocr android-app/app/src/main/assets/
          du -sh android-app/app/src/main/assets

      - name: 打包
        working-directory: android-app
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace --console=plain \
            -Pvc=${{ github.run_number }} -Pvn=1.${{ github.run_number }} 2>&1 \
            | tee /tmp/gradle.log

      # 构建日志在网页里，而「能打开浏览器翻日志」不该是排查的前提。
      # GitHub 的检查注解**不用登录就能读**，所以把关键几行直接摊成注解。
      - name: 失败了就把关键几段摊成注解
        if: failure()
        run: |
          L=/tmp/gradle.log
          if [ ! -f "$L" ]; then
            echo "::error::连 gradle 日志都没生成，说明挂在更早的步骤上"
            exit 0
          fi
          # 整段整段地抓（What went wrong / Caused by / Try / 失败的 task），
          # 因为报错原因常常在"下一行"，只抓含 error 的那一行是抓不到真凶的。
          # 多行要转义成 %0A 才能塞进一条注解，否则注解在第一行就断了。
          python3 - <<'PYEOF' || tail -n 20 "$L"
          import re
          lines = open('/tmp/gradle.log', encoding='utf-8', errors='replace').read().splitlines()
          blocks = []
          def add(title, body):
              body = body.strip('\r\n ')
              if body:
                  blocks.append(title + '  ' + body)
          for i, l in enumerate(lines):
              s = l.strip()
              if s.startswith('* Where:'):
                  # 这一段是「哪个文件第几行」，最有价值的一条
                  add('[Where]', '\n'.join(lines[i:i + 4]))
              elif 'What went wrong' in l:
                  add('[What went wrong]', '\n'.join(lines[i:i + 16]))
              elif re.match(r'Caused by\b', s):
                  add('[Caused by]', '\n'.join(lines[i:i + 4]))
              elif s.startswith('* Try:'):
                  add('[Try]', '\n'.join(lines[i:i + 5]))
              elif 'Execution failed for task' in l:
                  add('[Failed task]', '\n'.join(lines[i:i + 4]))
              elif 'Could not' in l or 'Unsupported' in l or 'not found' in l:
                  if ' at ' not in l:
                      add('[线索]', l)
          seen, out = set(), []
          for b in blocks:
              k = b[:120]
              if k in seen:
                  continue
              seen.add(k)
              b = b[:900].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              out.append('::error::' + b)
          print('\n'.join(out[:12]) or '::error::没抓到可读的报错，日志最后 20 行如下' ,
                end='')
          print('', end='\n')
          PYEOF
          exit 0

      - name: 取出来并体检
        run: |
          mkdir -p out
          cp android-app/app/build/outputs/apk/release/app-release.apk out/EnglishTrainer.apk
          ls -lh out/
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          echo "── 包名 / 版本 ──"
          "$BT/aapt2" dump badging out/EnglishTrainer.apk 2>/dev/null | head -4 || true
          echo "── 站点文件在不在里面 ──"
          unzip -l out/EnglishTrainer.apk > /tmp/ziplist.txt
          # ⚠️ 故意**不查** data/builtin.json：系统自带的真题只留本机，
          #    公开仓库里没有它（发布脚本会把公开目录里的副本清掉）。
          #    写成查它的话，每次构建都会误报缺文件、把构建搞挂。
          for f in assets/index.html assets/app.js assets/style.css \
                   assets/data/dict.json assets/data/samples.json assets/data/bank.json \
                   assets/ocr/tesseract.min.js assets/ocr/eng.traineddata.gz; do
            if grep -q -- "$f" /tmp/ziplist.txt; then echo "  ✓ $f"; else echo "  ✗ 缺 $f"; exit 1; fi
          done
          echo "── 指纹 ──"
          sha256sum out/EnglishTrainer.apk

      - name: 传成 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: EnglishTrainer.apk
          path: out/EnglishTrainer.apk
          if-no-files-found: error

      # 挂在 Release 上，别人**不用登录**就能下：
      #   https://github.com/zhouxuan078-max/english-exam-trainer/releases/latest/download/EnglishTrainer.apk
      # 文件名故意用纯英文 —— 中文名的直链要转码，发给别人很别扭。
      - name: 挂到 Release（别人不用登录就能下）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/note.md <<'EOF'
          ## 英语备考训练台 · 安卓版

          **下载下面的 `EnglishTrainer.apk`，传到手机上点开装上就行。**
          安卓会提示「来自未知来源的应用」，允许一下即可。

          ### 装它有什么好处
          - 题库、词典、图片识别引擎**全都打包在安装包里**，装上就能用，不联网
          - 桌面直接有图标，不用记网址、不经过浏览器
          - 答题记录、错题本、打卡、生词存在 App 自己那儿，
            **不会被「清除浏览器缓存」带走**

          ### 说明
          - 不申请通讯录 / 短信 / 相机 / 存储等任何敏感权限
          - 想更新：下载新版 APK **直接覆盖安装**即可，数据会保留
            （签名是固定的，所以能覆盖；不用先卸载）
          - 手机上打不开 GitHub 的话，用电脑先下好，再用微信 / QQ 传过去

          ### 保存文件去哪儿了
          在 App 里导出的 CSV / Anki / 备份文件，保存在
          **「内部存储 → Download → 英语备考训练台」** 文件夹里。
          EOF

          set +e
          gh release view apk-latest >/dev/null 2>&1 \
            || gh release create apk-latest \
                 --title "英语备考训练台 · 安卓安装包（最新版）" --notes-file /tmp/note.md
          gh release upload apk-latest out/EnglishTrainer.apk --clobber
          gh release edit apk-latest \
            --title "英语备考训练台 · 安卓安装包（最新版）" --notes-file /tmp/note.md
          code=$?
          set -e
          if [ "$code" != "0" ]; then
            echo "::error::APK 已经打好了，但没能挂到 Release（上面那条 gh 的报错就是原因）。最常见的一条：仓库 Actions 权限是只读 —— 去 Settings → Actions → General → Workflow permissions 选 Read and write permissions。在那之前，本次运行的 Artifacts 里也能下载到 APK。"
            exit 1
          fi

      - name: 写个摘要
        if: always()
        run: |
          {
            echo "### 打包结果"
            echo ""
            echo "- 版本：1.${{ github.run_number }}"
            if [ -f out/EnglishTrainer.apk ]; then
              echo "- 体积：$(du -h out/EnglishTrainer.apk | cut -f1)"
              echo "- 直链：https://github.com/zhouxuan078-max/english-exam-trainer/releases/latest/download/EnglishTrainer.apk"
            else
              echo "- **没有产出 APK**，看上面的日志／注解"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
